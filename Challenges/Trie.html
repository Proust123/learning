        // Word Search II
        // Given a 2-D grid of characters board and a list of strings words, return all words that are present in the grid.
        // For a word to be present it must be possible to form the word with a path in the board with horizontally or 
        // vertically neighboring cells. The same cell may not be used more than once in a word.

        // Example 1:
        // Input:
        // board = [
        // ["a","b","c","d"],
        // ["s","a","a","t"],
        // ["a","c","k","e"],
        // ["a","c","d","n"]
        // ],
        // words = ["bat","cat","back","backend","stack"]
        // Output: ["cat","back","backend"]

        // Example 2:
        // Input:
        // board = [
        // ["x","o"],
        // ["x","o"]
        // ],
        // words = ["xoxo"]
        // Output: []
          
        
        //yahan TrieNode ki class banai js ko use kr k hr word ka first character aik node banay ga 
        class TrieNode {
            constructor () {
                this.children = new Map()
                this.endsWith = false
            }

            addWords(word) {
                let curr = this
                // console.log(curr);
                
                for(let c of word) {
                    if(!curr.children.has(c)) {
                        curr.children.set(c, new TrieNode())
                    }
                    
                    curr = curr.children.get(c)
                    // console.log(curr);
                }
                
                curr.endsWith = true
                // console.log(curr);
            }
        }
        
        // let trie = new TrieNode()
        // trie.addWords('app')
        // trie.addWords('ace')
        // trie.addWords('bar')
        // console.log([...trie.children.get('a').children.keys()]);
        
        

        class Solution {
            
            findWords(board, words) {
                let root = new TrieNode()
                for(let word of words) {
                    root.addWords(word)
                }
                // console.log([...root.children.keys()]);
                // console.log([...root.children.values()]);
                
                let ROWS = board.length, COLS = board[0].length
                // console.log(ROWS, COLS);
                let res = new Set()
                let visited = new Set()

                function dfs(r, c, node, word) {
                    if( r < 0 || c < 0 ||
                        r >= ROWS || c >= COLS ||
                        visited.has(`${r}, ${c}`) || !node.children.has(board[r][c])
                    ) return 

                    visited.add(`${r}, ${c}`)
                    
                    node = node.children.get(board[r][c])
                    word += board[r][c]

                    if(node.endsWith) {
                        res.add(word)
                    }

                    dfs(r + 1, c, node, word);
                    dfs(r - 1, c, node, word);
                    dfs(r, c + 1, node, word);
                    dfs(r, c - 1, node, word);
                    
                    visited.delete(`${r}, ${c}`)
                }

                for(let r = 0; r < ROWS; r++) {
                    for(let c = 0; c < COLS; c++) {
                        dfs(r, c, root, '')
                    }
                }

                return Array.from(res)
            }

        }

        let sol = new Solution()
        console.log(sol.findWords([["a","b","c","d"],["s","a","a","t"],["a","c","k","e"],["a","c","d","n"]],
            ["bat","cat","back","backend","stack"]
        ));
