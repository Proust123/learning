        // //DYNAMIC PROGRAMMING
        function maxProfit(prices) {
            let maxP = 0, minBuy = prices[0]

            for(let sell of prices) {
                maxP = Math.max(maxP, sell-minBuy)
                minBuy = Math.min(sell, minBuy)
            }

            return maxP
        }
