        // //      1
        // //     / \
        // //    2   3

        // //Output: 6
        // //Example 2:

        // //Input: [-10,9,20,null,null,15,7]

        // //     -10

        // //  15      7

        // root.right = new Node(3)
       


        function maxPathSum(root) {
            let res = 0

            function solve(node) {
                if(node === null) {
                    return 0
                }

                let left = solve(node.left)
                let right = solve(node.right)
            
                let temp = Math.max(Math.max(left, right) + node.val, node.val)
                let ans = Math.max(temp, (left + right + node.val))

                res = Math.max(res, ans)

                return temp
            }
            solve(root)

            return res
        }

            constructor(val) {

                this.left = null
                this.right = null

        root.right.left = new Node(3)
        root.right.right = new Node(9)
        root.right.left.right = new Node(0)

                }

                let right = solve(node.right)

                let temp = Math.max(left, right) + node.val
                if(node.left === null && node.right === null) {
                    temp = Math.max(temp, node.val)
