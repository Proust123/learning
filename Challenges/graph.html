        //BFS ITERATIVE
        function cloneGraph(node) {
            if(!node) return null
            const oldToNew = new Map()
            const queue = []

            oldToNew.set(node, new Node(node.val))
            queue.push(node)

            while(queue.length > 0) {
                let curr = queue.shift()

                for(let nei of curr.neighbors) {

                    if(!oldToNew.has(nei)) {
                        oldToNew.set(nei, new Node(nei.val))
                        queue.push(nei)
                    }

                    oldToNew.get(curr).neighbors.push(oldToNew.get(nei))
                }
            }

            return oldToNew.get(node)
        }

        // //SOLUTION-2 TOPOLOGICAL SORT USING KAHN'S ALGORITHM
        function foreignDictionary(words) {
            const adjList = {}, indegree = {}

            for(let w of words) {
                for(let c of w) {
                    adjList[c] = new Set()
                    indegree[c] = 0
                }
            }

            for(let i = 0; i < words.length - 1; i++) {
                let w1 = words[i], w2 = words[i+1]
                let minLen = Math.min(w1.length, w2.length)

                if(
                    w1.length > w2.length &&
                    w1.slice(0, minLen) === w2.slice(0, minLen)
                ) return ""

                for(let j = 0; j < minLen; j++) {
                    if(w1[j] !== w2[j]){
                        //ye check indegree k liye perform ho rha hai, adjList for each letter set hai jo k 
                        //automatically duplicate remove kr deta hai, pr indegree jo aik simple object hai 
                        //increment kr jye ga agr koi duplicate letter phr sy add hoa tou, aur ye crucial 
                        //hai kahn's alogorithm k BFS traversal k liye kyu k queue mein sirf wohi letter add
                        //ho ga js ki indegree 0 hai
                        if(!adjList[w1[j]].has(w2[j])) {
                            adjList[w1[j]].add(w2[j])
                            indegree[w2[j]]++
                        }
                        break
                    }
                }

            }
            console.log(adjList);
            
            console.log(indegree);
            //js ki indegree zero hai matlab jo independent hai, js ki koi dependency nai hai matlab k jo ksi bhi
            //dependent nai hai pehle wo queue mein jaye ga aur remove/process (res mein jye ga) ho ga, phr jb wo
            //element jo pehle walay pe dependent tha abb wo independent ho jye ga kyu k abb next element ki
            //dependency khatam ho gi hai, ye wala element queue mein jye ga aur process ho ga and so on...
            const queue = []
            for(let c in indegree) {
                if(indegree[c] === 0) {
                    queue.push(c)
                }
            }
