      // 2-Word Search
      // Given a 2-D grid of characters board and a string word, return true if the word is present in the grid, 
      // otherwise return false.
      // For the word to be present it must be possible to form it with a path in the board with horizontally or vertically 
      // neighboring cells. The same cell may not be used more than once in a word.

      // Example 1:
      // Input: 
      // board = [
      //   ["A","B","C","D"],
      //   ["S","A","A","T"],
      //   ["A","C","A","E"]
      // ],
      // word = "CAT"
      // Output: true

      // Example 2:
      // Input: 
      // board = [
      //   ["A","B","C","D"],
      //   ["S","A","A","T"],
      //   ["A","C","A","E"]
      // ],
      // word = "BAT"
      // Output: false

      // //SOLUTION 
      function exist(board, word) {
        let ROWS = board.length
        let COLS = board[0].length
        let path = new Set()

        function dfs(r, c, i) {
          if(i === word.length) return true

          if(
            r < 0 ||
            c < 0 ||
            r >= ROWS ||
            c >= COLS ||
            board[r][c] !== word[i] || 
            path.has(`${r}, ${c}`)
          ) return false

          path.add(`${r}, ${c}`)

          let res = (
            dfs(r+1, c, i+1) ||
            dfs(r-1, c, i+1) ||
            dfs(r, c+1, i+1) ||
            dfs(r, c-1, i+1) 
          )
          path.delete(`${r}, ${c}`)

          return res
        }

        for(let r = 0; r < ROWS; r++) {
          for(let c = 0; c < COLS; c++) {
            if(dfs(r, c, 0)) return true
          }
        }

        return false
      }

      console.log(exist([["A","B","C","D"],["S","A","A","T"],["A","C","A","E"]], "BAT"));


      function wordsExist(board, words) {
        let res = []
        for(let word of words) {
          res.push(exist(board, word))
        }
        return res
      }
