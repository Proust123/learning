        function productExceptSelf(nums) {
            let res = new Array(nums.length).fill(1)

            for(let i = 1; i < nums.length; i++) {
                res[i] = res[i-1] * nums[i-1]
            }
            // console.log(res);

            let postFix = 1
            for(let i = nums.length-1; i >= 0; i--) {
                res[i] = res[i] * postFix
                postFix = postFix * nums[i]
            }
            
            return res
        }
