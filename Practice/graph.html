        // Clone Graph 
        // Given a node in a connected undirected graph, return a deep copy of the graph.
        // Each node in the graph contains an integer value and a list of its neighbors.

        // class Node {
        //     public int val;
        //     public List<Node> neighbors;
        // }
        // The graph is shown in the test cases as an adjacency list. An adjacency list is a mapping of nodes to lists, used to represent a 
        // finite graph. Each list describes the set of neighbors of a node in the graph.
        // For simplicity, nodes values are numbered from 1 to n, where n is the total number of nodes in the graph. The index of each node 
        // within the adjacency list is the same as the node's value (1-indexed).
        // The input node will always be the first node in the graph and have 1 as the value.

        // Example 1:
        // Input: adjList = [[2],[1,3],[2]]
        // Output: [[2],[1,3],[2]]
        // Explanation: There are 3 nodes in the graph.
        // Node 1: val = 1 and neighbors = [2].
        // Node 2: val = 2 and neighbors = [1, 3].
        // Node 3: val = 3 and neighbors = [2].

        // Example 2:
        // Input: adjList = [[]]
        // Output: [[]]
        // Explanation: The graph has one node with no neighbors.

        // Example 3:
        // Input: adjList = []
        // Output: []
        // Explanation: The graph is empty.



        class Node{
            constructor(value= 0, neighbours= []) {
                this.value = value
                this.neighbours = neighbours
            }
        }

        function cloneGraph(node) {
            if(!node) return null

            let oldToNew = new Map()

            function dfs(node) {
                if(oldToNew.has(node)) {
                    return oldToNew.get(node)
                }

                let copy = new Node(node.value)
                oldToNew.set(node, copy)

                for(let nei of node.neighbours) {
                    copy.neighbours.push(dfs(nei))
                }

                return copy
            }

            return dfs(node)
        }

        function buildGraph(adjList) {
            if(!adjList) return null

            let nodes = new Map()

            //Making Nodes 1, 2 & 3
            for(let i = 1; i <= adjList.length; i++) {
                nodes.set(i, new Node(i))
            }

            //Adding values to each node neighbor(array)
            for(let i = 1; i <= adjList.length; i++) {
                let node = nodes.get(i) //each node mein add hon gi values

                for(let val of adjList[i-1]) {
                    node.neighbours.push(nodes.get(val))
                }
            }

            //Return first node krwana hai jo entry point hai into graph
            return nodes.get(1)
        }
