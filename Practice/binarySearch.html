      // Search in Rotated Sorted Array
      // You are given an array of length n which was originally sorted in ascending order. It has now been rotated 
      // between 1 and n times. For example, the array nums = [1,2,3,4,5,6] might become:
      // [3,4,5,6,1,2] if it was rotated 4 times.

      // Given the rotated sorted array nums and an integer target, return the index of target within nums, or -1 
      // if it is not present.
      // You may assume all elements in the sorted rotated array nums are unique,
      // A solution that runs in O(n) time is trivial, can you write an algorithm that runs in O(log n) time?

      // Example 1:
      // Input: nums = [3,4,5,6,1,2], target = 1
      // Output: 4

      // Example 2:
      // Input: nums = [3,5,6,0,1,2], target = 4
      // Output: -1


      // //USING PIVOT
      function search(nums, target) {
        let l = 0, r = nums.length - 1
        while(l < r) {
          let m = l + Math.floor((r-l)/2)

          if(nums[m] > nums[r]) {
            l = m + 1
          }else{
            r = m
          }
        }

        let pivot = l

        let result = binarySearch(nums, target, 0, pivot-1)

        if(result !== -1) {
          return result
        }

        return result = binarySearch(nums, target, pivot, nums.length-1)
      }

      function binarySearch(nums, target, left, right) {
        while(left <= right) {
          let mid = left + Math.floor((right-left)/2)

          if(nums[mid] === target) {
            return mid
          }else if(nums[mid] < target) {
            left = mid+1
          }else{
            right = mid-1
          }
        }

        return -1
      }
