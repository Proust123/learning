       // 11-Serialize and Deserialize Binary Tree
        // Implement an algorithm to serialize and deserialize a binary tree.
        // Serialization is the process of converting an in-memory structure into a sequence of bits so that it can be 
        // stored or sent across a network to be reconstructed later in another computer environment.
        // You just need to ensure that a binary tree can be serialized to a string and this string can be deserialized 
        // to the original tree structure. There is no additional restriction on how your serialization/deserialization 
        // algorithm should work.

        // Note: The input/output format in the examples is the same as how NeetCode serializes a binary tree. You do not necessarily need to follow this format.

        // Example 1:
        // Input: root = [1,2,3,null,null,4,5]
        // Output: [1,2,3,null,null,4,5]

        // Example 2:
        // Input: root = []
        // Output: []


        class Codec{
            serialize(root) {
                if(!root) return  []
                let res = []

                function dfs(node) {
                    if(!node) {
                        res.push("N")
                        return
                    } 

                    res.push(String(node.val))
                    dfs(node.left)
                    dfs(node.right)
                }
                dfs(root)

                return res.join(',')
            }

            deserialize(data) {
                let values = data.split(',')
                let idx = 0

                function dfs() {
                    if(values[idx] === "N") {
                        idx++
                        return
                    }

                    let root = new TreeNode(+values[idx])
                    idx++

                    root.left = dfs()
                    root.right = dfs()

                    return root
                }

                return dfs()
            }
        }

        class Solution{
            serialize(root) {
                let res = []

                function dfs(node) {
                    if(node === null) {
                        res.push('N')
                        return
                    }

                    res.push(String(node.val))

                    dfs(node.left)
                    dfs(node.right)
                }
                dfs(root)

                return res.join(',')
            }

            deserialize(data) {
                let input = data.split(',')
                let i = 0

                function dfs() {
                    if(input[i] === 'N') {
                        i++
                        return null
                    }

                    let node = new TreeNode(+input[i])
                    i++

                    node.left = dfs()
                    node.right = dfs()

                    return node
                }
                return dfs()
            }
