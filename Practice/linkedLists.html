        // Merge K Sorted Linked Lists
        // You are given an array of k linked lists lists, where each list is sorted in ascending order.
        // Return the sorted linked list that is the result of merging all of the individual linked lists.

        // Example 1:
        // Input: lists = [[1,2,4],[1,3,5],[3,6]]
        // Output: [1,1,2,3,3,4,5,6]

        // Example 2:
        // Input: lists = []
        // Output: []

        // Example 3:
        // Input: lists = [[]]
        // Output: []

        function mergeKLists(lists) {
            if(lists === null) return null

            let minHeap = new minHeap((x) => x.val)
            for(let list of lists) {
                minHeap.insert(list)
            }

            let dummy = {val: 0, next: null}
            let curr = dummy

            while(minHeap.size > 0) {
                let node = minHeap.extractMin()

                curr.next = node
                curr = curr.next

                node = node.next
                if(node !== null) {
                    minHeap.insert(node)
                }
            }

            return dummy.next
        }
        
        

        function buildList(arr) {
            let dummy = {val: 0, next: null}
            let curr = dummy

            for(let num of arr) {
                curr.next = {val: num, next: null}
                curr = curr.next
            }

            return dummy.next
        }

        function printList(list) {
            let curr = list, arr = []

            while(curr) {
                arr.push(curr.val)
                curr = curr.next
            }

            return arr.join(' -> ')
        }


        let list1 = buildList([1,2,4])
        let list2 = buildList([1,3,5])
        let list3 = buildList([3,6])
        let merged = mergeKLists([list1, list2, list3])
